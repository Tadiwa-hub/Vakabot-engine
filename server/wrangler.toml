name = "vakabot-backend"
main = "src/index.ts"
compatibility_date = "2024-04-03"

[vars]
EVOLUTION_API_URL = "https://vakabot-engine.onrender.com"
TURSO_DATABASE_URL = "libsql://vakabot-tadiwanashe.aws-ap-northeast-1.turso.io"
PAYNOW_INTEGRATION_ID = "12345"

# NOTE: All secrets below must be set via 'wrangler secret put <KEY_NAME>'
# Run these commands once to configure production secrets:
#   wrangler secret put TURSO_AUTH_TOKEN
#   wrangler secret put EVOLUTION_API_KEY
#   wrangler secret put CLERK_SECRET_KEY
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put OPENROUTER_API_KEY
#   wrangler secret put PAYNOW_INTEGRATION_KEY

[triggers]
crons = ["* * * * *"]
